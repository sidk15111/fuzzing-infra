name: Test WIF
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/658175672767/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-build-trigger@sparc-vulnerability-detection.iam.gserviceaccount.com
      - run: gcloud compute instance-groups managed describe fuzzing-build-bot --zone=us-central1-b
